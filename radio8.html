<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borosi Pro Radio - Ultimate Admin</title>
    <style>
        :root { --accent: #00ff00; --bg: #050505; --panel: #111; --text: #eee; --dead: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* BAL OLDAL: LEJÁTSZÓ ÉS STATISZTIKA */
        .now-playing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #151515 0%, #050505 100%); border-right: 2px solid #222; padding: 20px; gap: 15px; }
        .clock-container { font-size: 5rem; font-weight: bold; color: #ffff00; text-shadow: 0 0 20px rgba(255, 255, 0, 0.3); }
        .logo-box { width: 350px; height: 350px; background: #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 10px solid var(--accent); overflow: hidden; }
        .logo-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .station-title { font-size: 1.8rem; color: #ffff00; font-weight: bold; text-align: center; height: 50px; }

        /* JOBB OLDAL: LISTA */
        .sidebar { width: 650px; background: #0f0f0f; display: flex; flex-direction: column; }
        .search-container { padding: 20px; background: #1a1a1a; border-bottom: 2px solid var(--accent); }
        .search-input { width: 100%; background: #000; border: 2px solid #333; color: var(--accent); padding: 12px; font-size: 1.2rem; border-radius: 10px; outline: none; box-sizing: border-box; }
        .station-list { flex: 1; overflow-y: auto; padding: 10px; }
        .station-list::-webkit-scrollbar { width: 20px; }
        .station-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .item { padding: 12px; margin-bottom: 8px; background: #181818; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; transition: 0.2s; }
        .item:hover { background: #222; }
        .item.active { background: #252525; border-left: 6px solid var(--accent); }
        .item.is-dead { border-left: 6px solid var(--dead); opacity: 0.7; }
        .item img { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; background: #000; }
        .item span { font-size: 1.3rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .controls { padding: 15px; background: #151515; border-top: 1px solid #333; }
        audio { width: 100%; filter: invert(0.9) hue-rotate(100deg); }

        /* ADMIN GOMBOK */
        .admin-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .btn { border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: 0.3s; }
        .btn-check { background: #333; color: var(--accent); border: 1px solid var(--accent); }
        .btn-save { background: #0055ff; color: white; }
        .btn-danger { background: #e94560; color: white; }
        .btn:hover { filter: brightness(1.3); transform: translateY(-2px); }

        /* OVERLAY */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .setup-card { background: #111; padding: 40px; border-radius: 20px; border: 2px solid var(--accent); text-align: center; width: 500px; }
        
        #checker-status { position: fixed; bottom: 100px; right: 20px; background: #ffff00; color: black; padding: 15px 25px; border-radius: 50px; font-weight: bold; display: none; z-index: 10001; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="setup-card">
            <h1 style="color: var(--accent);">Borosi Admin Rádió</h1>
            <p>Tallózz be egy fájlt (.m3u, .m3u8 vagy .json)</p>
            <input type="file" id="filePicker" accept=".m3u,.m3u8,.json" style="display: none;" onchange="handleFile(this)">
            <button class="btn btn-save" style="padding: 15px 30px; font-size: 1rem;" onclick="document.getElementById('filePicker').click()">📁 FÁJL KIVÁLASZTÁSA</button>
            <div style="margin: 20px 0; color: #444;">VAGY</div>
            <textarea id="rawInput" placeholder="M3U szöveg beillesztése..." style="width:100%; height:80px; background:#000; color:var(--accent); border:1px solid #333; padding:10px; box-sizing:border-box; border-radius:8px;"></textarea>
            <button class="btn btn-check" style="margin-top:15px;" onclick="loadFromText()">🚀 BETÖLTÉS SZÖVEGBŐL</button>
        </div>
    </div>

    <div id="checker-status">Ellenőrzés...</div>

    <div class="now-playing">
        <div class="clock-container" id="digitalClock">00:00:00</div>
        <div class="logo-box"><img id="mainLogo" src="https://via.placeholder.com/400?text=RADIO"></div>
        <div id="mainTitle" class="station-title">Válassz adót!</div>
        
        <div class="admin-btns">
            <button class="btn btn-check" onclick="persistentCheck()">🔍 HALOTT KERESÉS (3X PRÓBA)</button>
            <button class="btn btn-save" onclick="downloadList()">💾 LISTA MENTÉSE (JSON)</button>
            <button class="btn btn-danger" onclick="clearStorage()" style="grid-column: span 2;">🗑️ TELJES TÖRLÉS ÉS ÚJ LISTA</button>
        </div>
        <div id="stats" style="font-size: 0.8rem; color: #666;"></div>
    </div>

    <div class="sidebar">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Keresés (írj be '[HALOTT]'-at a hibásakhoz)...">
        </div>
        <div class="station-list" id="stationList"></div>
        <div class="controls"><audio id="audioPlayer" controls></audio></div>
    </div>

<script>
    let stations = [];
    const STORAGE_KEY = 'borosi_ultimate_radio';

    window.onload = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            stations = JSON.parse(saved);
            document.getElementById('overlay').style.display = 'none';
            updateStats();
            renderList();
        }
    };

    function handleFile(input) {
        const reader = new FileReader();
        reader.onload = (e) => processInput(e.target.result);
        reader.readAsText(input.files[0]);
    }

    function loadFromText() {
        const text = document.getElementById('rawInput').value.trim();
        if(text) processInput(text);
    }

    function processInput(content) {
        let tempStations = [];
        if (content.trim().startsWith('[') || content.trim().startsWith('{')) {
            try { tempStations = JSON.parse(content); } catch(e) { alert("JSON hiba!"); return; }
        } else {
            const lines = content.split(/\r?\n/);
            let current = { name: '', logo: '', url: '' };
            let seen = new Set();
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    let logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    current.logo = logoMatch ? logoMatch[1].replace(/file:\/\/.*[\/\\]/, 'logos/') : '';
                    current.name = line.split(',')[1] || 'Névtelen';
                } else if (line && !line.startsWith('#')) {
                    current.url = line;
                    let norm = line.toLowerCase().replace(/^https?:\/\//, "").replace(/\/$/, "");
                    if (!seen.has(norm)) {
                        seen.add(norm);
                        tempStations.push({...current});
                    }
                    current = { name: '', logo: '', url: '' };
                }
            }
        }
        if (tempStations.length > 0) {
            stations = tempStations;
            save();
            document.getElementById('overlay').style.display = 'none';
            renderList();
        }
    }

    function renderList(search = "") {
        const container = document.getElementById('stationList');
        container.innerHTML = "";
        const filtered = stations.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).slice(0, 150);

        filtered.forEach(s => {
            const isDead = s.name.startsWith("[HALOTT]");
            const div = document.createElement('div');
            div.className = `item ${isDead ? 'is-dead' : ''}`;
            div.innerHTML = `<img src="${s.logo}" onerror="this.src='https://via.placeholder.com/60?text=R'"><span>${s.name}</span>`;
            div.onclick = () => {
                document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                const p = document.getElementById('audioPlayer');
                p.src = s.url;
                p.play();
                document.getElementById('mainLogo').src = s.logo;
                document.getElementById('mainTitle').innerText = s.name;
            };
            container.appendChild(div);
        });
        updateStats();
    }

    async function persistentCheck() {
        if (stations.length === 0) return;
        if (!confirm(`Ellenőrzés indítása ${stations.length} adón.\nZeno FM-nél is hatékony (3x próbálkozás).\nA hibásak neve elé [HALOTT] kerül.`)) return;

        const statusBox = document.getElementById('checker-status');
        statusBox.style.display = "block";
        let deadFound = 0;

        for (let i = 0; i < stations.length; i++) {
            let s = stations[i];
            if (s.name.startsWith("[HALOTT]")) continue;

            let ok = false;
            statusBox.innerText = `CHECK: ${i+1}/${stations.length} | Halott: ${deadFound}`;

            for (let retry = 1; retry <= 3; retry++) {
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 8000);
                    await fetch(s.url, { method: 'GET', mode: 'no-cors', signal: ctrl.signal });
                    clearTimeout(tid);
                    ok = true;
                    break; 
                } catch (e) {
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            if (!ok) {
                s.name = "[HALOTT] " + s.name;
                deadFound++;
            }
            if (i % 100 === 0) save(); 
        }

        statusBox.style.display = "none";
        save();
        renderList();
        alert(`Kész! ${deadFound} új halott adó megjelölve.`);
    }

    function downloadList() {
        const blob = new Blob([JSON.stringify(stations, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "tisztitott_radio_lista.json";
        a.click();
        URL.revokeObjectURL(url);
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(stations)); }
    
    function updateStats() {
        const dead = stations.filter(s => s.name.startsWith("[HALOTT]")).length;
        document.getElementById('stats').innerText = `Összesen: ${stations.length} | Ebből halott: ${dead}`;
    }

    function clearStorage() {
        if(confirm("Törlöd az adatokat?")) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
    }

    let timeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => renderList(e.target.value), 300);
    });

    function updateClock() {
        document.getElementById('digitalClock').innerText = new Date().toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
