<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Borosi Dual M3U8 Processor Pro</title>
    <style>
        :root { --accent: #00ff00; --bg: #0a0a0a; --panel: #161b22; }
        body { 
            background: var(--bg); color: #c9d1d9; font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .container {
            background: var(--panel); padding: 40px; border-radius: 20px;
            width: 90%; max-width: 850px; text-align: center; border: 1px solid #30363d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .drop-zone {
            border: 2px dashed #444; padding: 30px; border-radius: 15px;
            margin: 20px 0; transition: 0.3s; cursor: pointer;
        }
        .drop-zone:hover { border-color: var(--accent); background: rgba(0,255,0,0.05); }
        
        /* OPCIÓK PANEL */
        .options {
            background: #0d1117; padding: 15px; border-radius: 10px;
            margin-bottom: 20px; border: 1px solid #30363d; display: flex;
            justify-content: center; align-items: center; gap: 20px;
        }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

        .results-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;
            display: none;
        }
        .result-card {
            background: #0d1117; padding: 20px; border-radius: 12px; border: 1px solid #30363d;
            text-align: left;
        }
        .btn {
            background: var(--accent); color: #000; padding: 12px 20px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 15px; font-size: 0.9rem; transition: 0.2s;
        }
        .btn-blue { background: #1f6feb; color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        #status { margin: 20px 0; font-weight: bold; color: #8b949e; }
        .stats-num { color: var(--accent); font-family: monospace; font-size: 1.1rem; }
        .loader {
            width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite; display: none; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color: white; margin: 0;">M3U8 Dual Processor</h1>
        <p>Válaszd ki az opciókat, majd tallózd be a listát!</p>

        <div class="options">
            <label class="checkbox-wrapper">
                <input type="checkbox" id="ignoreProtocol" checked>
                <span>HTTP / HTTPS duplák szűrése</span>
            </label>
            <label class="checkbox-wrapper">
                <input type="checkbox" id="ignoreCase" checked>
                <span>Kis/Nagybetű különbség elvetése</span>
            </label>
        </div>

        <div class="drop-zone" onclick="document.getElementById('fileIn').click()">
            <strong>📁 KATTINTS A FÁJL KIVÁLASZTÁSÁHOZ</strong>
            <div style="font-size: 0.8rem; margin-top: 10px; color: #6e7681;">(JS konstans vagy M3U8 fájl)</div>
        </div>
        <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)">

        <div id="loader" class="loader"></div>
        <div id="status">Várakozás fájlra...</div>

        <div id="results" class="results-grid">
            <div class="result-card">
                <h3 style="margin-top:0; color:var(--accent);">1. TISZTÍTOTT</h3>
                <p style="font-size: 0.8rem;">A duplikátumok teljesen törölve.</p>
                <div id="stat1" style="font-size: 0.9rem;">Egyedi adók: <span class="stats-num">0</span></div>
                <button class="btn" onclick="download('clean')">💾 LETÖLTÉS (.m3u8)</button>
            </div>

            <div class="result-card">
                <h3 style="margin-top:0; color:#1f6feb;">2. JELÖLT</h3>
                <p style="font-size: 0.8rem;">Minden marad, a duplák neve [DUPLIKÁTUM!!!].</p>
                <div id="stat2" style="font-size: 0.9rem;">Összes tétel: <span class="stats-num">0</span></div>
                <button class="btn btn-blue" onclick="download('flagged')">💾 LETÖLTÉS (.m3u8)</button>
            </div>
        </div>
    </div>

<script>
    let cleanM3U = "";
    let flaggedM3U = "";

    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');

        status.innerText = "Feldolgozás folyamatban...";
        loader.style.display = "block";
        document.getElementById('results').style.display = "none";

        reader.onload = (e) => { processContent(e.target.result); };
        reader.readAsText(file);
    }

    function processContent(content) {
        let stations = [];
        const raw = content.trim();
        const ignoreProtocol = document.getElementById('ignoreProtocol').checked;
        const ignoreCase = document.getElementById('ignoreCase').checked;

        try {
            if (raw.includes('const stations =') || raw.startsWith('[')) {
                let jsonPart = raw.replace(/^const\s+\w+\s*=\s*/, '').replace(/;$/, '').trim();
                stations = JSON.parse(jsonPart);
            } else {
                const lines = raw.split(/\r?\n/);
                let cur = { name: "Névtelen", logo: "" };
                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith("#EXTINF:")) {
                        let logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                        cur.logo = logoMatch ? logoMatch[1] : "";
                        let comma = line.lastIndexOf(",");
                        cur.name = comma > -1 ? line.substring(comma + 1).trim() : "Névtelen";
                    } else if (line && !line.startsWith("#")) {
                        stations.push({ name: cur.name, logo: cur.logo, url: line });
                        cur = { name: "Névtelen", logo: "" };
                    }
                }
            }
        } catch (e) {
            alert("Hiba: Nem felismerhető formátum!");
            return;
        }

        let seenUrls = new Set();
        let cleanBuffer = ["#EXTM3U\n"];
        let flaggedBuffer = ["#EXTM3U\n"];
        let cleanCount = 0;
        let totalCount = 0;

        for (let s of stations) {
            // URL Normalizálás a szűréshez
            let compareUrl = s.url;
            if (ignoreProtocol) compareUrl = compareUrl.replace(/^https?:\/\//i, '');
            if (ignoreCase) compareUrl = compareUrl.toLowerCase();
            
            // Eltávolítjuk a záró perjelet is a pontosabb egyezésért (opcionális de hasznos)
            compareUrl = compareUrl.replace(/\/$/, "");

            const entry = `#EXTINF:-1 tvg-logo="${s.logo}",${s.name}\n${s.url}\n`;
            const dupEntry = `#EXTINF:-1 tvg-logo="${s.logo}",[DUPLIKÁTUM!!!] ${s.name}\n${s.url}\n`;

            if (!seenUrls.has(compareUrl)) {
                seenUrls.add(compareUrl);
                cleanBuffer.push(entry);
                flaggedBuffer.push(entry);
                cleanCount++;
            } else {
                flaggedBuffer.push(dupEntry);
            }
            totalCount++;
        }

        cleanM3U = cleanBuffer.join("");
        flaggedM3U = flaggedBuffer.join("");

        document.getElementById('loader').style.display = "none";
        status.innerText = "Kész!";
        document.getElementById('results').style.display = "grid";
        document.getElementById('stat1').querySelector('span').innerText = cleanCount.toLocaleString();
        document.getElementById('stat2').querySelector('span').innerText = totalCount.toLocaleString();
    }

    function download(type) {
        const content = (type === 'clean') ? cleanM3U : flaggedM3U;
        const filename = (type === 'clean') ? "radio_clean.m3u8" : "radio_flagged.m3u8";
        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
