<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📻 Borosi Radio Lite📻</title>
    <style>
        /* ============================================================
           BEÁLLÍTÁSOK (Itt tudod finomítani a kinézetet)
           ============================================================ */
        :root {
            --green: #00ff00;          /* Fő keret és gomb szín */
            --yellow: #ffff00;         /* Óra és aktuális cím színe */

            /* --- ASZTALI (PC) MÉRETEK --- */
            --desk-clock-size: 3rem;    /* Óra mérete gépen */
            --desk-logo-size: 420px;    /* Logó mérete gépen */
            --desk-title-size: 3rem;  /* Szóló adó címe gépen */
            --desk-list-width: 620px;   /* Jobb oldali lista szélessége */
            --desk-item-font: 1.5rem;     /* Lista betűmérete gépen */

            /* --- MOBIL MÉRETEK --- */
            --mob-player-height: 24vh;  /* Felső rész magassága (vh = képernyő %-a) */
            --mob-clock-size: 1.1rem;   /* Óra mérete mobilon */
            --mob-logo-size: 100px;     /* Logó mérete mobilon */
            --mob-title-size: 1.1rem;   /* Szóló adó címe mobilon */
            --mob-list-font: 1.1rem;    /* Lista betűmérete mobilon (hogy könnyebb legyen rányomni) */
        }

        /* --- ALAP STÍLUS (Ne bántsd, hacsak nem muszáj) --- */
        body { 
            background: url('./logos/fanart1.jpg') no-repeat center center fixed; 
            background-size: cover; color: #eee; font-family: 'Segoe UI', sans-serif; 
            margin: 0; height: 100vh; display: flex; overflow: hidden; 
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: -1;
        }

        .main-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* BAL OLDAL (PC) / FELSŐ RÉSZ (MOBIL) */
        .player-side { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0, 0, 0, 0.4); border-right: 1px solid rgba(255,255,255,0.1); 
            padding: 20px; text-align: center;
        }

        /* JOBB OLDAL (PC) / ALSÓ RÉSZ (MOBIL) */
        .list-side { 
            width: var(--desk-list-width); background: rgba(10, 10, 10, 0.9); 
            display: flex; flex-direction: column; position: relative; backdrop-filter: blur(15px);
            overflow: hidden;
        }

        .clock-container { font-size: var(--desk-clock-size); font-weight: bold; color: var(--yellow); text-shadow: 0 0 20px rgba(255,255,0,0.5); }
        
        .logo-box { 
            width: var(--desk-logo-size); height: var(--desk-logo-size); 
            border: 4px solid var(--green); border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; 
        }
        .logo-box img { max-width: 90%; max-height: 90%; object-fit: contain; }

        #mainTitle { margin-top: 15px; font-weight: bold; color: var(--yellow); font-size: var(--desk-title-size); }

        /* FIX KERESŐ ÉS STATISZTIKA */
        .search-container { padding: 12px; background: rgba(20, 20, 20, 0.98); border-bottom: 2px solid var(--green); position: sticky; top: 0; z-index: 10; }
        .search-input { width: 100%; background: #000; border: 1px solid #444; color: var(--green); padding: 12px; border-radius: 8px; outline: none; box-sizing: border-box; font-size: 1rem; }
        .stats { font-size: 0.75rem; color: #aaa; margin-top: 6px; text-align: right; font-family: monospace; }

        /* LISTA GÖRDÜLŐ RÉSZE */
        .station-list { flex: 1; overflow-y: auto; padding: 10px; scroll-behavior: smooth; }
        .item { 
            padding: 10px; margin-bottom: 6px; background: rgba(45, 45, 45, 0.5); border-radius: 8px; 
            display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); 
            font-size: var(--desk-item-font);
        }
        .item.active { border-left: 6px solid var(--green); background: rgba(0, 255, 0, 0.15); }
        .item img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #222; }

        /* VEZÉRLŐK */
        .controls { padding: 12px; background: #000; border-top: 1px solid #333; position: sticky; bottom: 0; z-index: 10; }
        .ctrl-group { display: flex; justify-content: space-around; align-items: center; gap: 10px; }
        .ctrl-btn { background: #151515; border: 1px solid var(--green); color: var(--green); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; flex: 1; }
        
        #scrollTopBtn { position: fixed; bottom: 110px; right: 20px; width: 45px; height: 45px; background: var(--green); color: #000; border: none; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: none; z-index: 100; }

        /* ============================================================
           MOBIL NÉZETI BEÁLLÍTÁSOK (850px alatt lép életbe)
           ============================================================ */
        @media (max-width: 850px) {
            body { overflow: hidden; height: 100vh; }
            .main-container { flex-direction: column; height: 100%; }
            
            .player-side { 
                height: var(--mob-player-height); flex: none; 
                background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--green);
                justify-content: center; /* Ha a tetejére akarod: flex-start, és adj padding-top-ot */
            }
            
            .list-side { width: 100%; flex: 1; }
            
            .clock-container { font-size: var(--mob-clock-size) !important; }
            .logo-box { width: var(--mob-logo-size) !important; height: var(--mob-logo-size) !important; }
            #mainTitle { font-size: var(--mob-title-size) !important; }
            .item { font-size: var(--mob-list-font) !important; }
        }

        audio { display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="player-side">
            <div class="clock-container" id="digitalClock">00:00:00</div>
            <div class="logo-box"><img id="mainLogo" src="./logos/fanart1.jpg"></div>
            <div id="mainTitle">Válassz adót...</div>
        </div>

        <div class="list-side">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Keresés...">
                <div class="stats" id="stats">Betöltés...</div>
            </div>
            
            <button id="scrollTopBtn">↑</button>
            <div class="station-list" id="stationList"></div>
            
            <div class="controls">
                <div class="ctrl-group">
                    <button onclick="prevStation()" class="ctrl-btn">⏮</button>
                    <button id="playPauseBtn" onclick="togglePlay()" class="ctrl-btn">▶</button>
                    <button onclick="nextStation()" class="ctrl-btn">⏭</button>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" style="width: 60px; accent-color: var(--green);">
                </div>
                <audio id="audioPlayer"></audio>
            </div>
        </div>
    </div>

    const listContainer = document.getElementById('stationList');
    const searchInput = document.getElementById('searchInput');
    const statsDiv = document.getElementById('stats');
    const player = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    let filteredStations = [...stations];

    function renderList(filter = "", append = false) {
        if (!append) {
            listContainer.innerHTML = "";
            filteredStations = stations.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));
            statsDiv.innerText = `${filteredStations.length.toLocaleString()} / ${stations.length.toLocaleString()} adó`;
        }
        const start = append ? listContainer.children.length : 0;
        const chunk = filteredStations.slice(start, start + 80);

        chunk.forEach(s => {
            const div = document.createElement('div');
            div.className = 'item';
            let logoSrc = s.logo.startsWith('http') ? s.logo : './' + s.logo;
            div.innerHTML = `<img src="${logoSrc}" loading="lazy" onerror="this.src='https://via.placeholder.com/50?text=R'"> <span>${s.name}</span>`;
            
            div.onclick = (e) => {
                document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                player.src = s.url;
                player.play().catch(() => {});
                document.getElementById('mainLogo').src = logoSrc;
                document.getElementById('mainTitle').innerText = s.name;
                
                div.scrollIntoView({ behavior: 'smooth', block: 'center' });

                if(window.innerWidth < 850 && e.isTrusted) {
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            };
            listContainer.appendChild(div);
        });
    }

    function togglePlay() { if (player.src) player.paused ? player.play() : player.pause(); }
    function changeVolume(val) { player.volume = val; }
    function nextStation() {
        const active = document.querySelector('.item.active');
        if (active && active.nextElementSibling) active.nextElementSibling.click();
        else if (!active && listContainer.firstChild) listContainer.firstChild.click();
    }
    function prevStation() {
        const active = document.querySelector('.item.active');
        if (active && active.previousElementSibling) active.previousElementSibling.click();
    }

    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => renderList(e.target.value), 300);
    });

    window.addEventListener('keydown', (e) => {
        if (document.activeElement === searchInput) return;
        if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if(e.code === 'ArrowRight' || e.code === 'ArrowDown') { e.preventDefault(); nextStation(); }
        if(e.code === 'ArrowLeft' || e.code === 'ArrowUp') { e.preventDefault(); prevStation(); }
    });

    player.onplay = () => playPauseBtn.innerText = "⏸";
    player.onpause = () => playPauseBtn.innerText = "▶";

    function handleScroll() {
        if (listContainer.scrollTop + listContainer.clientHeight >= listContainer.scrollHeight - 800) {
            if (listContainer.children.length < filteredStations.length) renderList(searchInput.value, true);
        }
        document.getElementById('scrollTopBtn').style.display = listContainer.scrollTop > 800 ? "block" : "none";
    }

    listContainer.addEventListener('scroll', handleScroll);
    document.getElementById('scrollTopBtn').onclick = () => listContainer.scrollTo({top:0, behavior:'smooth'});

    setInterval(() => {
        document.getElementById('digitalClock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);

    renderList();
</script>
</body>
</html>
