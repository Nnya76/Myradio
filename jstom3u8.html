<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Borosi JS-Array to M3U8</title>
    <style>
        :root { --accent: #00ff00; --bg: #0a0a0a; }
        body { 
            background: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }
        .container {
            background: #111; padding: 30px; border-radius: 15px; border: 1px solid #333;
            width: 90%; max-width: 800px; text-align: center;
        }
        textarea {
            width: 100%; height: 300px; background: #000; color: var(--accent);
            border: 1px solid #444; border-radius: 8px; padding: 10px;
            font-family: 'Courier New', monospace; font-size: 0.9rem; margin-top: 20px;
        }
        .btn {
            background: var(--accent); color: #000; padding: 15px 30px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 20px; font-size: 1.1rem;
        }
        .btn:hover { filter: brightness(1.2); }
        #status { margin-top: 15px; color: #ffff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color: var(--accent); margin-top: 0;">JS Tömb ➔ M3U8 Konverter</h1>
        <p style="color: #888;">Másold be ide a "const stations = [...]" részt!</p>
        
        <textarea id="inputArea" placeholder="const stations = [ { ... }, { ... } ];"></textarea>
        
        <button class="btn" onclick="processData()">🚀 KONVERTÁLÁS ÉS LETÖLTÉS</button>
        <div id="status"></div>
    </div>

<script>
    function processData() {
        const input = document.getElementById('inputArea').value.trim();
        const status = document.getElementById('status');
        
        if (!input) {
            status.innerText = "Hiba: A mező üres!";
            return;
        }

        try {
            // 1. ELŐKÉSZÍTÉS: Levágjuk a "const stations =" részt és a végső pontosvesszőt
            let cleanData = input
                .replace(/^const\s+\w+\s*=\s*/, '') // Eltávolítja: const akármi = 
                .replace(/;$/, '')                  // Eltávolítja a pontosvesszőt a végéről
                .trim();

            // 2. ÉRTELMEZÉS: JSON-ként olvassuk be (a JS tömb szintaktikája megegyezik a JSON-nal)
            const stations = JSON.parse(cleanData);

            if (!Array.isArray(stations)) {
                status.innerText = "Hiba: Ez nem egy érvényes lista!";
                return;
            }

            // 3. M3U8 ÉPÍTÉS
            let m3u8 = "#EXTM3U\n";
            const buffer = ["#EXTM3U\n"];

            stations.forEach(s => {
                const name = s.name || "Névtelen adó";
                const logo = s.logo || "";
                const url = s.url || "";
                if (url) {
                    buffer.push(`#EXTINF:-1 tvg-logo="${logo}",${name}\n${url}\n`);
                }
            });

            // 4. LETÖLTÉS
            const blob = new Blob([buffer.join("")], { type: "text/plain" });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = "exportalt_lista.m3u8";
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
                status.innerText = `Sikeres konvertálás: ${stations.length} adó feldolgozva!`;
            }, 100);

        } catch (e) {
            status.innerText = "Hiba: Érvénytelen formátum! Ellenőrizd a zárójeleket.";
            console.error(e);
        }
    }
</script>
</body>
</html>
