<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ipari Idő Kalkulátor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0; 
        }
        .calculator { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 360px; 
            border: 1px solid #333;
            margin-bottom: 30px;
        }
        h2 { text-align: center; color: #3b82f6; margin-top: 0; margin-bottom: 5px; font-size: 1.4em; }
        .subtitle { text-align: center; color: #666; font-size: 0.75em; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }
        
        .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .input-group { flex: 1; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; font-weight: bold; }
        
        input { 
            width: 100%; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 18px; 
            text-align: center; 
        }
        input:focus { border-color: #3b82f6; outline: none; background: #333; }

        .ops { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        .btn-row { display: flex; gap: 8px; }
        
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            transition: 0.2s; 
            color: white; 
        }
        .add { background: #059669; }
        .sub { background: #dc2626; }
        .start-btn { background: #f39c12; color: #000; text-transform: uppercase; font-size: 13px; }
        
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .result-box { 
            background: #2563eb; 
            color: white; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            margin-top: 10px; 
        }
        .result-label { font-size: 11px; opacity: 0.8; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
        .result-value { font-size: 26px; font-weight: bold; letter-spacing: 1px; }

        hr { border: 0; border-top: 1px dashed #444; margin: 10px 0 20px 0; width: 100%; }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Műszak & Indítás</h2>
        <div class="subtitle">Visszaszámolás a célidőből</div>
        
        <div class="row">
            <div class="input-group">
                <label>Mikorra legyen kész? (Óra)</label>
                <input type="number" id="start_h1" value="06" min="0" max="23">
            </div>
            <div class="input-group">
                <label>Perc</label>
                <input type="number" id="start_m1" value="15" min="0" max="59">
            </div>
        </div>

        <div class="ops">
            <button class="start-btn" onclick="calcStart()">Mikor kell elindítani?</button>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Hőkezelés hossza (Óra)</label>
                <input type="number" id="start_h2" value="2" min="0">
            </div>
            <div class="input-group">
                <label>Perc</label>
                <input type="number" id="start_m2" value="00" min="0" max="59">
            </div>
        </div>

        <div class="result-box" style="background: #92400e;">
            <div class="result-label">Indítási időpont:</div>
            <div class="result-value" id="res_start">04:15</div>
        </div>
    </div>

    <div class="calculator">
        <h2>Idő +/- Kalkulátor</h2>
        <div class="subtitle">Általános összeadás / kivonás</div>
        
        <div class="row">
            <div class="input-group">
                <label>Óra</label>
                <input type="number" id="gen_h1" value="22" min="0">
            </div>
            <div class="input-group">
                <label>Perc</label>
                <input type="number" id="gen_m1" value="40" min="0" max="59">
            </div>
        </div>

        <div class="ops">
            <div class="btn-row">
                <button class="add" onclick="calcGen('add')">+</button>
                <button class="sub" onclick="calcGen('sub')">-</button>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Óra</label>
                <input type="number" id="gen_h2" value="2" min="0">
            </div>
            <div class="input-group">
                <label>Perc</label>
                <input type="number" id="gen_m2" value="15" min="0" max="59">
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">Eredmény:</div>
            <div class="result-value" id="res_gen">00:55</div>
        </div>
    </div>

    <script>
        // Formázó függvény a vezető nullákhoz
        function format(h, m) {
            return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
        }

        // 1. Műszakváltás számoló (Mindig kivonás)
        function calcStart() {
            let h1 = parseInt(document.getElementById('start_h1').value) || 0;
            let m1 = parseInt(document.getElementById('start_m1').value) || 0;
            let h2 = parseInt(document.getElementById('start_h2').value) || 0;
            let m2 = parseInt(document.getElementById('start_m2').value) || 0;

            let total = ((h1 * 60) + m1) - ((h2 * 60) + m2);
            total = ((total % 1440) + 1440) % 1440;

            document.getElementById('res_start').innerText = format(Math.floor(total / 60), total % 60);
        }

        // 2. Általános számoló
        function calcGen(op) {
            let h1 = parseInt(document.getElementById('gen_h1').value) || 0;
            let m1 = parseInt(document.getElementById('gen_m1').value) || 0;
            let h2 = parseInt(document.getElementById('gen_h2').value) || 0;
            let m2 = parseInt(document.getElementById('gen_m2').value) || 0;

            let t1 = (h1 * 60) + m1;
            let t2 = (h2 * 60) + m2;
            let total = (op === 'add') ? t1 + t2 : t1 - t2;

            total = ((total % 1440) + 1440) % 1440;
            
            let rh = Math.floor(total / 60);
            let rm = total % 60;
            document.getElementById('res_gen').innerText = rh + " óra " + (rm < 10 ? "0" + rm : rm) + " perc";
        }

        // Kezdő értékek beállítása
        calcStart();
        calcGen('add');
    </script>
</body>
</html>
