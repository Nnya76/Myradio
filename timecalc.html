<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idő Számológép</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .calculator { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; color: #2563eb; margin-top: 0; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .input-group { flex: 1; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input { width: 100%; background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .ops { display: flex; justify-content: space-around; margin: 20px 0; }
        button { flex: 1; margin: 0 5px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.2s; }
        .add { background: #059669; color: white; }
        .sub { background: #dc2626; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        .result-box { background: #2563eb; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .result-label { font-size: 14px; opacity: 0.9; }
        .result-value { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Idő Számológép</h2>
    
    <div class="row">
        <div class="input-group">
            <label>Óra</label>
            <input type="number" id="h1" value="22" min="0">
        </div>
        <div class="input-group">
            <label>Perc</label>
            <input type="number" id="m1" value="40" min="0" max="59">
        </div>
    </div>

    <div class="ops">
        <button class="add" onclick="calculate('add')">+</button>
        <button class="sub" onclick="calculate('sub')">-</button>
    </div>

    <div class="row">
        <div class="input-group">
            <label>Óra</label>
            <input type="number" id="h2" value="2" min="0">
        </div>
        <div class="input-group">
            <label>Perc</label>
            <input type="number" id="m2" value="15" min="0" max="59">
        </div>
    </div>

    <div class="result-box">
        <div class="result-label">Eredmény</div>
        <div class="result-value" id="result">00:55</div>
    </div>
</div>

<script>
    function calculate(op) {
        // Értékek beolvasása
        let h1 = parseInt(document.getElementById('h1').value) || 0;
        let m1 = parseInt(document.getElementById('m1').value) || 0;
        let h2 = parseInt(document.getElementById('h2').value) || 0;
        let m2 = parseInt(document.getElementById('m2').value) || 0;

        // Minden percbe átszámolva
        let totalMinutes1 = (h1 * 60) + m1;
        let totalMinutes2 = (h2 * 60) + m2;
        let resultMinutes;

        if (op === 'add') {
            resultMinutes = totalMinutes1 + totalMinutes2;
        } else {
            resultMinutes = totalMinutes1 - totalMinutes2;
        }

        // 24 órás ciklus kezelése (Modulo 1440 perc)
        // JavaScript % operátora negatív számokra is negatívat ad, ezért (n % m + m) % m trükk kell
        let dayMinutes = 24 * 60;
        resultMinutes = ((resultMinutes % dayMinutes) + dayMinutes) % dayMinutes;

        let resH = Math.floor(resultMinutes / 60);
        let resM = resultMinutes % 60;

        // Megjelenítés formázása (vezető nullák)
        document.getElementById('result').innerText = 
            resH + " óra " + (resM < 10 ? "0" + resM : resM) + " perc";
    }

    // Alapértelmezett számítás indításkor
    calculate('add');
</script>

</body>
</html>
