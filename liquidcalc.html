<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-liquid Dark Mixer</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 500px; 
            margin-bottom: 25px; 
            border: 1px solid #333;
        }
        h2 { 
            color: #3498db; 
            text-align: center; 
            margin-top: 0; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 10px; 
        }
        h3 { 
            font-size: 0.85em; 
            color: #888; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .group { margin-bottom: 15px; }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            font-size: 0.85em; 
            color: #bbb; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1em; 
            background-color: #2a2a2a; 
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #333;
        }
        .res-box { 
            margin-top: 15px; 
            padding: 15px; 
            background-color: #252a30; 
            border-left: 5px solid #3498db; 
            border-radius: 4px; 
            line-height: 1.6; 
        }
        .highlight { 
            font-weight: bold; 
            color: #f39c12; 
            font-size: 1.1em; 
        }
        .switch-group { 
            background: #2c231a; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border: 1px solid #5e412f; 
        }
        input[type="checkbox"] { 
            width: auto; 
            cursor: pointer; 
            accent-color: #f39c12;
        }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>1. Összeöntés</h2>
    <h3>Két meglévő alaplé keverése</h3>
    <div class="group">
        <label>1. alaplé (ml)</label>
        <input type="number" id="v1" value="200" oninput="szamol1()">
    </div>
    <div class="group">
        <label>1. alaplé erőssége (mg)</label>
        <input type="number" id="c1" value="18" oninput="szamol1()">
    </div>
    <div class="group">
        <label>2. alaplé (ml)</label>
        <input type="number" id="v2" value="100" oninput="szamol1()">
    </div>
    <div class="group">
        <label>2. alaplé erőssége (mg)</label>
        <input type="number" id="c2" value="0" oninput="szamol1()">
    </div>
    <div class="res-box" id="res1">
        Eredmény: <b>300 ml</b> | Erősség: <span class="highlight">12.00 mg</span>
    </div>
</div>

<div class="card">
    <h2>2. Hígítás</h2>
    <h3>Adott erősség elérése 0-ással</h3>
    <div class="group">
        <label>Erős alaplé (ml)</label>
        <input type="number" id="h_v1" value="20" oninput="szamol2()">
    </div>
    <div class="group">
        <label>Erős alaplé ereje (mg)</label>
        <input type="number" id="h_c1" value="18" oninput="szamol2()">
    </div>
    <div class="group">
        <label>Célerősség (mg)</label>
        <input type="number" id="h_target" value="6" oninput="szamol2()">
    </div>
    <div class="res-box" id="res2">
        Adj hozzá: <span class="highlight">40.0 ml</span> 0-ást.<br>
        Összesen: <b>60.0 ml</b> lesz.
    </div>
</div>

<div class="card">
    <h2>3. Booster & Aroma</h2>
    <h3>Kiszámolt recept flakonméretre</h3>
    
    <div class="switch-group">
        <input type="checkbox" id="use_aroma" checked onchange="szamol3()">
        <label for="use_aroma" style="margin:0; cursor:pointer; color:#f39c12;">+10ml aroma (10%)</label>
    </div>

    <div class="group">
        <label>Flakon mérete (ml)</label>
        <input type="number" id="b_target_v" value="100" oninput="szamol3()">
    </div>
    <div class="group">
        <label>Cél erősség (mg)</label>
        <input type="number" id="b_target_c" value="3" oninput="szamol3()">
    </div>
    <div class="group">
        <label>Booster ereje (mg)</label>
        <input type="number" id="b_mg" value="18" oninput="szamol3()">
    </div>
    
    <div class="res-box" id="res3">
        Kell: <span class="highlight">1.67 db</span> (16.7 ml) booster.<br>
        Aroma: <b>10 ml</b><br>
        0-ás alap: <b>73.3 ml</b>
    </div>
</div>

<script>
function szamol1() {
    const v1 = parseFloat(document.getElementById('v1').value) || 0;
    const c1 = parseFloat(document.getElementById('c1').value) || 0;
    const v2 = parseFloat(document.getElementById('v2').value) || 0;
    const c2 = parseFloat(document.getElementById('c2').value) || 0;
    const osszV = v1 + v2;
    const vegsoC = osszV > 0 ? ((v1 * c1) + (v2 * c2)) / osszV : 0;
    document.getElementById('res1').innerHTML = `Eredmény: <b>${osszV} ml</b> | Erősség: <span class="highlight">${vegsoC.toFixed(2)} mg</span>`;
}

function szamol2() {
    const v1 = parseFloat(document.getElementById('h_v1').value) || 0;
    const c1 = parseFloat(document.getElementById('h_c1').value) || 0;
    const target = parseFloat(document.getElementById('h_target').value) || 0;
    if (target > 0 && c1 > target) {
        const osszV = (v1 * c1) / target;
        const kell = osszV - v1;
        document.getElementById('res2').innerHTML = `Adj hozzá: <span class="highlight">${kell.toFixed(1)} ml</span> 0-ást.<br>Összesen: <b>${osszV.toFixed(1)} ml</b> lesz.`;
    } else { document.getElementById('res2').innerText = "Várjuk a számokat..."; }
}

function szamol3() {
    const targetV = parseFloat(document.getElementById('b_target_v').value) || 0;
    const targetC = parseFloat(document.getElementById('b_target_c').value) || 0;
    const boostMg = parseFloat(document.getElementById('b_mg').value) || 18;
    const hasAroma = document.getElementById('use_aroma').checked;
    const aromaV = hasAroma ? 10 : 0;

    if (boostMg > targetC) {
        const boostV = (targetV * targetC) / boostMg;
        const db = boostV / 10;
        const alapV = targetV - boostV - aromaV;
        
        document.getElementById('res3').innerHTML = 
            `Kell: <span class="highlight">${db.toFixed(2)} db</span> (${boostV.toFixed(1)} ml) booster.<br>` +
            (hasAroma ? `Aroma: <b>10 ml</b><br>` : "") +
            `0-ás alap: <b>${alapV > 0 ? alapV.toFixed(1) : 0} ml</b>`;
    } else { document.getElementById('res3').innerText = "Túl magas cél!"; }
}

szamol1(); szamol2(); szamol3();
</script>

</body>
</html>
